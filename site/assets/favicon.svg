  <!-- macOS Icon Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#1e3a5f" stroke-width="6"/>
  <circle cx="256" cy="248" r="210" fill="url(#glow)"/>
